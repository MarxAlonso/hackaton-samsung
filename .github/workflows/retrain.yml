name: Reentrenamiento semanal

# Cada lunes (06:00 hora de Lima): descarga el clima nuevo, monitorea la deriva, prueba un modelo
# retador contra el campeón, corre los tests y, solo si todo pasa, publica el sitio en Cloudflare.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

concurrency: retrain

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - run: pip install -r ml/requirements.txt

      # El clima histórico se guarda entre ejecuciones: así la ingesta solo pide los días nuevos
      - uses: actions/cache@v4
        with:
          path: ml/data/raw
          key: clima-${{ github.run_id }}
          restore-keys: clima-

      - name: Pipeline (ingesta → simulación → entrenamiento → monitoreo → reentrenamiento → exportación)
        run: bash ml/run_pipeline.sh

      - name: Tests del pipeline
        run: cd ml && python -m pytest tests -q

      - name: Tests de la API
        run: cd api && python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: reportes-del-modelo
          path: |
            ml/reports/*.json
            ml/reports/*.jsonl

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Publicar el sitio en Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run build
          npx wrangler deploy
