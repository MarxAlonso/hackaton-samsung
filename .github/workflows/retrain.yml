name: Reentrenamiento semanal

# Cada lunes (06:00 hora de Lima): descarga el clima nuevo, monitorea la deriva, prueba un modelo
# retador contra el campeón, corre los tests y, solo si todo pasa, publica el sitio en Cloudflare.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

concurrency: retrain

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - run: pip install -r ml/requirements.txt

      # El clima y los casos se guardan entre ejecuciones: la ingesta solo pide lo nuevo (los CSV del CDC pesan ~400 MB)
      - uses: actions/cache@v4
        with:
          path: ml/data/raw
          key: datos-${{ github.run_id }}
          restore-keys: |
            datos-
            clima-

      - name: Pipeline (ingesta de clima y casos → entrenamiento → monitoreo → reentrenamiento → exportación)
        run: bash ml/run_pipeline.sh

      - name: Tests del pipeline
        run: cd ml && python -m pytest tests -q

      - name: Tests de la API
        run: cd api && python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: reportes-del-modelo
          path: |
            ml/reports/*.json
            ml/reports/*.jsonl

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Protecciones de la IA y glosario: si fallan, no se publica
      - name: Pruebas de la web (IA y glosario)
        working-directory: web
        run: |
          npm ci
          npm test

      - name: Publicar el sitio en Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run build
          npx wrangler deploy

      # Verifica el sitio publicado: páginas, datos sin NaN, modelos ONNX, PWA e IA
      - name: Prueba de humo del sitio publicado
        working-directory: web
        run: node scripts/smoke.mjs

      # Avisa por el celular a quienes activaron alertas. Si falla no deshace la publicación del sitio.
      - name: Enviar alertas a los suscriptores
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python ml/src/notify.py
